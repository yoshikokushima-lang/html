<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>極限爆弾タイピング - フル入力対応版</title>
    <script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>
    <style>
        :root {
            --bg-color: #0f172a; --panel-color: #1e293b; --accent-color: #38bdf8;
            --danger-color: #ef4444; --success-color: #22c55e; --text-main: #f8fafc;
        }
        body {
            background-color: var(--bg-color); color: var(--text-main);
            font-family: 'Helvetica Neue', Arial, sans-serif; 
            display: flex; flex-direction: column; align-items: center; justify-content: center; 
            height: 100vh; margin: 0; overflow: hidden;
        }

        #status-bar { display: flex; justify-content: space-between; width: 850px; margin-bottom: 20px; background: var(--panel-color); padding: 15px 40px; border-radius: 50px; border: 1px solid rgba(255,255,255,0.1); }
        #turn-indicator { font-size: 1.5rem; font-weight: bold; padding: 5px 30px; border-radius: 10px; transition: 0.3s; }
        .my-turn-bg { background: var(--success-color); color: white; box-shadow: 0 0 15px var(--success-color); }
        .enemy-turn-bg { background: #475569; color: white; }

        #main-lane { position: relative; width: 850px; height: 120px; background: #111827; border-radius: 20px; border: 3px solid #334155; margin-bottom: 40px; }
        #rail { position: absolute; top: 60px; left: 30px; right: 30px; height: 4px; background: #334155; border-radius: 2px; }
        
        #bomb { 
            position: absolute; width: 80px; height: 80px; top: 20px; right: 0; 
            font-size: 55px; display: flex; align-items: center; justify-content: center; 
            transition: right 0.05s linear; z-index: 10;
            filter: drop-shadow(0 0 15px var(--danger-color));
        }

        #typing-area { text-align: center; width: 90%; }
        #kana-display { font-size: 2.2rem; color: #94a3b8; margin-bottom: 10px; min-height: 2.8rem; }
        #roma-display { font-size: 4.2rem; font-weight: 900; letter-spacing: 0.3rem; }
        .typed { color: var(--success-color); text-shadow: 0 0 15px var(--success-color); }
        .untyped { color: #2d3748; }

        .overlay { position: fixed; inset: 0; background: var(--bg-color); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 500; }
        .btn { padding: 15px 45px; background: var(--accent-color); color: white; border: none; border-radius: 50px; cursor: pointer; font-weight: bold; font-size: 1.2rem; }
    </style>
</head>
<body>

    <div id="setup-overlay" class="overlay">
        <h1>極限爆弾タイピング</h1>
        <input type="text" id="room-id" style="padding:15px; margin-bottom:20px; text-align:center; font-size:1.2rem;" placeholder="合言葉" value="あいうえお">
        <button class="btn" onclick="initConnection()">対戦開始</button>
    </div>

    <div id="waiting-overlay" class="overlay" style="display:none;">
        <h2>相手を待っています...</h2>
        <button class="btn" style="background:#475569;" onclick="location.reload()">キャンセル</button>
    </div>

    <div id="result-overlay" class="overlay" style="display:none;">
        <h1 id="result-text" style="font-size: 6rem;"></h1>
        <button class="btn" onclick="location.reload()">もう一度</button>
    </div>

    <div id="status-bar">
        <div id="turn-indicator" class="enemy-turn-bg">待機中</div>
        <div style="font-size: 1.5rem;"><span style="color:var(--accent-color)">ターン:</span> <span id="total-turns">1</span></div>
    </div>

    <div id="main-lane">
        <div id="rail"></div>
        <div id="bomb">💣</div>
    </div>

    <div id="typing-area">
        <div id="kana-display">接続待機中...</div>
        <div id="roma-display">
            <span id="typed" class="typed"></span><span id="untyped" class="untyped"></span>
        </div>
    </div>

    <script>
        // ローマ字マップ（じゃ/ja, zya 等の多種多様な打ち方を網羅）
        const ROMAN_MAP = {
            'あ':['a'],'い':['i'],'う':['u','wu'],'え':['e'],'お':['o'],
            'か':['ka'],'き':['ki'],'く':['ku'],'け':['ke'],'こ':['ko'],
            'さ':['sa'],'し':['si','shi'],'す':['su'],'せ':['se'],'そ':['so'],
            'た':['ta'],'ち':['ti','chi'],'つ':['tu','tsu'],'て':['te'],'と':['to'],
            'な':['na'],'に':['ni'],'ぬ':['nu'],'ね':['ne'],'の':['no'],
            'は':['ha'],'ひ':['hi'],'ふ':['fu','hu'],'へ':['he'],'ほ':['ho'],
            'ま':['ma'],'み':['mi'],'む':['mu'],'め':['me'],'も':['mo'],
            'や':['ya'],'ゆ':['yu'],'よ':['yo'],
            'ら':['ra'],'り':['ri'],'る':['ru'],'れ':['re'],'ろ':['ro'],
            'わ':['wa'],'を':['wo'],'ん':['nn','xn','n'],
            'が':['ga'],'ぎ':['gi'],'ぐ':['gu'],'げ':['ge'],'ご':['go'],
            'ざ':['za'],'じ':['zi','ji'],'ず':['zu'],'ぜ':['ze'],'ぞ':['zo'],
            'だ':['da'],'ぢ':['di'],'づ':['du'],'で':['de'],'ど':['do'],
            'ば':['ba'],'び':['bi'],'ぶ':['bu'],'べ':['be'],'ぼ':['bo'],
            'ぱ':['pa'],'ぴ':['pi'],'ぷ':['pu'],'ぺ':['pe'],'ぽ':['po'],
            'きゃ':['kya'],'きゅ':['kyu'],'きょ':['kyo'],
            'しゃ':['sya','sha'],'しゅ':['syu','shu'],'しょ':['syo','sho'],
            'ちゃ':['tya','cha'],'ちゅ':['tyu','chu'],'ちょ':['tyo','cho'],
            'にゃ':['nya'],'にゅ':['nyu'],'にょ':['nyo'],
            'ひゃ':['hya'],'ひゅ':['hyu'],'ひょ':['hyo'],
            'みゃ':['mya'],'みゅ':['myu'],'みょ':['myo'],
            'りゃ':['rya'],'りゅ':['ryu'],'りょ':['ryo'],
            'ぎゃ':['gya'],'ぎゅ':['gyu'],'ぎょ':['gyo'],
            'じゃ':['ja','zya','jya'],'じゅ':['ju','zyu','jyu'],'じょ':['jo','zyo','jyo'],
            'びゃ':['bya'],'びゅ':['byu'],'びょ':['byo'],
            'ぴゃ':['pya'],'ぴゅ':['pyu'],'ぴょ':['pyo'],
            'ぁ':['xa','la'],'ぃ':['xi','li'],'ぅ':['xu','lu'],'ぇ':['xe','le'],'ぉ':['xo','lo'],
            'ゃ':['xya','lya'],'ゅ':['xyu','lyu'],'ょ':['xyo','lyo'],'っ':['xtu','ltu'],
            'ー':['-']
        };

        const WORDS = ["じゃがいも", "しんかんせん", "にんじゃ", "じょおうさま", "ちゃーはん", "きょうりゅう", "ばくだん", "たいぴんぐ", "たのしいね", "ありがとう", "さようなら", "おなかがすいた", "ふじさん", "りんご", "がっこう", "とうきょう", "ゆめをかなえる", "かれーらいす"];

        let peer, conn, isMyTurn = false, totalTurns = 1, isPlaying = false;
        let bombPos = 0, timeLeft = 10, targetKana = "", typedRoma = "", currentRomaGuide = "";

        // 動的にローマ字の組み合わせを計算（「っ」＋「か」＝「kka」などの対応）
        function solve(kana, currentInput) {
            if (kana === "") return currentInput === "" ? "" : null;
            
            // 促音「っ」の特殊処理
            if (kana.startsWith('っ') && kana.length > 1) {
                let nextKana = kana[1];
                let nextOptions = ROMAN_MAP[nextKana];
                if (nextOptions) {
                    for (let opt of nextOptions) {
                        let firstChar = opt[0];
                        if ("abcdefghijklmnopqrstuvwxyz".includes(firstChar) && !"aeiouwn".includes(firstChar)) {
                            let ssuRes = firstChar + opt;
                            if (ssuRes.startsWith(currentInput)) {
                                let res = solve(kana.substring(2), "");
                                if (res !== null) return ssuRes + res;
                            }
                            if (currentInput.startsWith(ssuRes)) {
                                let res = solve(kana.substring(2), currentInput.substring(ssuRes.length));
                                if (res !== null) return ssuRes + res;
                            }
                        }
                    }
                }
            }

            // 通常のマップ検索
            for (let i = 3; i >= 1; i--) {
                let chunk = kana.substring(0, i);
                if (ROMAN_MAP[chunk]) {
                    for (let r of ROMAN_MAP[chunk]) {
                        if (r.startsWith(currentInput)) {
                            let res = solve(kana.substring(i), "");
                            if (res !== null) return r + res;
                        }
                        if (currentInput.startsWith(r)) {
                            let res = solve(kana.substring(i), currentInput.substring(r.length));
                            if (res !== null) return r + res;
                        }
                    }
                }
            }
            return null;
        }

        function initConnection() {
            const roomName = document.getElementById('room-id').value;
            const hashedId = "bomb-v3-final-" + btoa(unescape(encodeURIComponent(roomName))).substring(0, 10);
            document.getElementById('setup-overlay').style.display = "none";
            document.getElementById('waiting-overlay').style.display = "flex";

            peer = new Peer();
            peer.on('open', () => {
                const c = peer.connect(hashedId);
                setupEvents(c, false);
                const hostPeer = new Peer(hashedId);
                hostPeer.on('connection', (incoming) => setupEvents(incoming, true));
            });
        }

        function setupEvents(c, first) {
            c.on('open', () => {
                if (conn) return;
                conn = c;
                isMyTurn = first;
                document.getElementById('waiting-overlay').style.display = "none";
                startGame();
            });
            c.on('data', data => {
                if (data.type === 'start-turn') {
                    isMyTurn = true;
                    totalTurns = data.totalTurns;
                    bombPos = 0;
                    nextWord();
                }
                if (data.type === 'sync') bombPos = data.pos;
                if (data.type === 'lose') endGame("勝ち！");
            });
        }

        function startGame() {
            isPlaying = true;
            if (isMyTurn) nextWord();
            else setWaitState();
            requestAnimationFrame(gameLoop);
        }

        function setWaitState() {
            document.getElementById('kana-display').innerText = "相手が入力中...";
            document.getElementById('typed').innerText = "";
            document.getElementById('untyped').innerText = "";
            document.getElementById('turn-indicator').innerText = "相手の番です";
            document.getElementById('turn-indicator').className = "enemy-turn-bg";
            bombPos = 0;
        }

        function nextWord() {
            targetKana = WORDS[Math.floor(Math.random() * WORDS.length)];
            typedRoma = "";
            currentRomaGuide = solve(targetKana, "");
            timeLeft = Math.max(3.0, 11.0 - (totalTurns * 0.4));
            bombPos = 0;
            document.getElementById('turn-indicator').innerText = "あなたの番！";
            document.getElementById('turn-indicator').className = "my-turn-bg";
            updateUI();
        }

        function updateUI() {
            document.getElementById('kana-display').innerText = targetKana;
            document.getElementById('typed').innerText = typedRoma;
            document.getElementById('untyped').innerText = currentRomaGuide ? currentRomaGuide.substring(typedRoma.length) : "";
            document.getElementById('total-turns').innerText = totalTurns;
        }

        window.addEventListener('keydown', e => {
            if (!isPlaying || !isMyTurn) return;
            const key = e.key.toLowerCase();
            if (key === 'shift' || key === 'control' || key === 'alt') return;

            let newGuide = solve(targetKana, typedRoma + key);
            if (newGuide) {
                typedRoma += key;
                currentRomaGuide = newGuide;
                if (typedRoma.length === currentRomaGuide.length) {
                    isMyTurn = false;
                    totalTurns++;
                    conn.send({ type: 'start-turn', totalTurns: totalTurns });
                    setWaitState();
                }
                updateUI();
            } else if(/^[a-z-]$/.test(key)) {
                bombPos += 30;
                conn.send({ type: 'sync', pos: bombPos });
            }
        });

        function gameLoop() {
            if (!isPlaying) return;
            const trackWidth = 850 - 80;
            
            if (isMyTurn) {
                bombPos += (trackWidth / (timeLeft * 60));
                conn.send({ type: 'sync', pos: bombPos });
            }
            
            document.getElementById('bomb').style.right = bombPos + 'px';
            
            if (bombPos >= trackWidth && isMyTurn) {
                conn.send({ type: 'lose' });
                endGame("負け...");
            }
            requestAnimationFrame(gameLoop);
        }

        function endGame(msg) {
            isPlaying = false;
            document.getElementById('result-overlay').style.display = 'flex';
            document.getElementById('result-text').innerText = msg;
            document.getElementById('result-text').style.color = msg === "勝ち！" ? "var(--success-color)" : "var(--danger-color)";
        }
    </script>
</body>
</html>
